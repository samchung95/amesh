name: release-artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  clean-room-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out AMESH implementation
        uses: actions/checkout@v4
        with:
          path: amesh
          persist-credentials: false
      - name: Check out pinned public reference in isolated reviewer context
        uses: actions/checkout@v4
        with:
          repository: kestra-io/kestra
          ref: db49f3b2c2af60d61df10adb6f9fc34e4776b65b
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run provenance and similarity gates
        run: |
          python amesh/scripts/check_clean_room.py --reference-tree reference
          python -m pip install uv
          cd amesh
          uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint

  build:
    needs: clean-room-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install uv
          uv sync --extra runtime --extra dev --locked
      - run: make validate
      - run: bash scripts/package_repo.sh
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ../amesh.zip
            ../amesh.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ../amesh.zip
            ../amesh.tar.gz
            ../amesh.sha256
          generate_release_notes: true
