name: release-artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: make validate
      - run: bash scripts/package_repo.sh
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ../amesh.zip
            ../amesh.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ../amesh.zip
            ../amesh.tar.gz
            ../amesh.sha256
          generate_release_notes: true
