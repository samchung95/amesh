  name: ameshpluginpolicies.platform.amesh.io
  labels:
    app.kubernetes.io/name: amesh-operator
  annotations:
    platform.amesh.io/schema-version: v1alpha1
spec:
  group: platform.amesh.io
  scope: Namespaced
  names:
    kind: AmeshPluginPolicy
    listKind: AmeshPluginPolicyList
    plural: ameshpluginpolicies
    singular: pluginpolicies
    categories:
    - amesh
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Tenant
      type: string
      jsonPath: .spec.tenant
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - tenant
            - namespace
            - document
            properties:
              tenant:
                type: string
                description: AMESH tenant selected from the operator target allowlist.
                minLength: 1
                maxLength: 128
              key:
                type: string
                description: AMESH resource key. Defaults to metadata.name.
                minLength: 1
                maxLength: 1024
              deletionPolicy:
                type: string
                description: Delete removes supported remote resources; Retain releases
                  only the finalizer.
                enum:
                - Retain
                - Delete
                default: Retain
              namespace:
                type: string
                description: AMESH namespace, distinct from the Kubernetes namespace.
                minLength: 1
                maxLength: 255
              document:
                type: object
                description: Desired AMESH API document. Server-managed fields belong
                  in status, not spec.
                x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
                minimum: 0
              remoteId:
                type: string
              remoteRevision:
                type: string
              appliedDigest:
                type: string
                pattern: ^sha256:[0-9a-f]{64}$
              remoteDigest:
                type: string
                pattern: ^sha256:[0-9a-f]{64}$
              failureCount:
                type: integer
                format: int32
                minimum: 0
              retryAfter:
                type: string
                format: date-time
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  properties:
                    type:
                      type: string
                      description: Condition type.
                      minLength: 1
                      maxLength: 64
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    reason:
                      type: string
                      description: Stable machine-readable reason.
                      minLength: 1
                      maxLength: 128
                    message:
                      type: string
                      maxLength: 1024
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    lastTransitionTime:
                      type: string
                      format: date-time
