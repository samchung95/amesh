[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amesh"
version = "0.2.0"
description = "AMESH (Agent Mesh), a clean-room AGPL durable workflow and agent orchestration platform"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "AMESH contributors"}]
keywords = ["agent-mesh", "workflow", "orchestration", "scheduler", "durable-execution", "open-source"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "croniter>=6.2.4,<7",
  # fastapi, pydantic and pydantic-settings are pinned exactly because
  # tests/test_generated_contracts.py asserts byte-stable generated schemas
  # and OpenAPI output; a schema-emission change in either library would
  # otherwise break CI with no code change. Bump deliberately and
  # regenerate contracts (make contracts) in the same commit.
  "fastapi==0.141.1",
  "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4",
  "jsonschema>=4.25,<5",
  "kubernetes>=36.0.3,<37",
  "mcp>=2,<3",
  "prometheus-client>=0.25,<1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "PyYAML>=6.0.2,<7",
  "ruamel-yaml>=0.19.1,<0.20",
  "tzdata>=2026.3",
  "uuid6>=2025.0.1,<2026",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
runtime = [
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "aioboto3>=13.3,<14",
  "azure-storage-blob[aio]>=12.30,<13",
  "azure-identity>=1.25,<2",
  "google-cloud-storage>=3.13,<4",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-croniter>=6.2.4.20260711,<7",
  "types-jsonschema>=4.25,<5",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
amesh = "amesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["amesh"]
mypy_path = "src"
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["amesh"]

[tool.coverage.report]
show_missing = true
fail_under = 75
