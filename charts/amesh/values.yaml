image:
  repository: amesh
  tag: mvp
  pullPolicy: IfNotPresent

appEnv: production

auth:
  mode: credentials
  policy: local
  sessionIdleSeconds: 1800
  sessionAbsoluteSeconds: 43200
  sessionRotationSeconds: 900
  sessionOverlapSeconds: 30
  loginRateLimitPerMinute: 30
  loginMaxFailures: 5
  loginLockSeconds: 900

server:
  replicas: 2
  resources: {}

worker:
  enabled: false
  replicas: 1
  pollSeconds: 5
  recoveryGraceSeconds: 120
  reconciliationIntervalSeconds: 60
  reconciliationMaxRepairs: 10
  reconciliationStuckAfterSeconds: 300
  group: default
  resources: {}

serviceRoles:
  executor:
    enabled: true
    replicas: 2
    resources: {}
  scheduler:
    enabled: true
    replicas: 2
    resources: {}
  worker:
    enabled: true
    replicas: 2
    resources: {}
  indexer:
    enabled: true
    replicas: 2
    resources: {}
  maintenance:
    enabled: true
    replicas: 1
    resources: {}

highAvailability:
  topologyKey: topology.kubernetes.io/zone
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
  terminationGracePeriodSeconds: 30
  minReadySeconds: 5
  maxUnavailable: 0
  maxSurge: 1
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

tenancy:
  mode: single
  singleTenantSlug: default

service:
  type: ClusterIP
  port: 8000
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"

serviceAccount:
  create: true
  name: ""

database:
  existingSecret: amesh-database
  key: database-url
  readReplicaExistingSecret: ""
  readReplicaKey: database-read-replica-url
  migrationExistingSecret: ""
  migrationKey: database-url
  poolSize: 10
  maxOverflow: 10
  poolTimeoutSeconds: 30
  poolRecycleSeconds: 1800
  preparedStatementCacheSize: 100
  tlsMode: verify-full
  tlsCAFile: ""

objectStorage:
  backend: s3
  endpoint: ""
  region: us-east-1
  bucket: amesh
  workloadIdentity: true
  encryptionKeyId: ""
  proxyURL: ""
  caFile: ""
  azureAccountURL: ""
  googleProject: ""
  googleEndpoint: ""
  googleCredentialsFile: ""
  consistencyAttempts: 5
  consistencyDelaySeconds: 0.1
  spoolMemoryBytes: 8388608
  existingSecret: ""
  accessKeyKey: access-key
  secretKeyKey: secret-key
  azureAccountKeyKey: azure-account-key

recovery:
  enabled: false
  schedule: "0 3 * * *"
  profile: v1
  actor: system:scheduled-recovery
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 0
  resources: {}

adminToken:
  existingSecret: amesh-admin
  key: token

tokenPepper:
  existingSecret: amesh-admin
  key: token-pepper
  previousKey: ""

openRouter:
  existingSecret: ""
  key: api-key
  model: openai/gpt-5.6-luna

taskNamespace: ""
logLevel: INFO
serviceHeartbeatSeconds: 5
serviceStaleAfterSeconds: 20
serviceCycleSeconds: 5

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
