image:
  repository: amesh
  tag: mvp
  pullPolicy: IfNotPresent

server:
  replicas: 1
  resources: {}

worker:
  replicas: 1
  pollSeconds: 5
  recoveryGraceSeconds: 120
  group: default
  resources: {}

tenancy:
  mode: single
  singleTenantSlug: default

service:
  type: ClusterIP
  port: 8000
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"

serviceAccount:
  create: true
  name: ""

database:
  existingSecret: amesh-database
  key: database-url
  readReplicaExistingSecret: ""
  readReplicaKey: database-read-replica-url
  migrationExistingSecret: ""
  migrationKey: database-url
  poolSize: 10
  maxOverflow: 10
  poolTimeoutSeconds: 30
  poolRecycleSeconds: 1800
  preparedStatementCacheSize: 100
  tlsMode: verify-full
  tlsCAFile: ""

adminToken:
  existingSecret: amesh-admin
  key: token

tokenPepper:
  existingSecret: amesh-admin
  key: token-pepper
  previousKey: ""

openRouter:
  existingSecret: ""
  key: api-key
  model: openai/gpt-5.6-luna

taskNamespace: ""
logLevel: INFO

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
