apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "amesh.fullname" . }}-migrate
  labels:
    {{- include "amesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "amesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "amesh.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "amesh.migrations"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.database.existingSecret .Values.database.migrationExistingSecret | quote }}
                  key: {{ .Values.database.migrationKey | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: DATABASE_TLS_MODE
              value: {{ .Values.database.tlsMode | quote }}
{{- if .Values.database.tlsCAFile }}
            - name: DATABASE_TLS_CA_FILE
              value: {{ .Values.database.tlsCAFile | quote }}
{{- end }}
