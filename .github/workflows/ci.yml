name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: harnesses/pi/package-lock.json
      - name: Install
        run: |
          python -m pip install uv
          uv pip install --system -e '.[dev]'
          npm ci --prefix harnesses/pi
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: |
          npm test --prefix harnesses/pi
          pytest --cov=amesh --cov-report=term-missing
      - name: Run deterministic harness conformance report
        if: ${{ always() }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/amesh-harness-conformance"
          mkdir -p "$output_dir"
          uv run --extra runtime --extra dev python scripts/run_agent_harness_conformance.py \
            --adapter pi --output "$output_dir/report.first.json"
          uv run --extra runtime --extra dev python scripts/run_agent_harness_conformance.py \
            --adapter pi --output "$output_dir/report.second.json"
          cmp --silent "$output_dir/report.first.json" "$output_dir/report.second.json"
          cp "$output_dir/report.first.json" "$output_dir/harness-compatibility.json"
      - name: Upload harness compatibility report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: harness-compatibility-${{ github.sha }}
          path: ${{ runner.temp }}/amesh-harness-conformance/harness-compatibility.json
          if-no-files-found: error
      - name: Regenerate and validate planning artifacts
        run: |
          python scripts/regenerate_planning_artifacts.py
          python scripts/validate_backlog.py
          python scripts/check_clean_room.py
          uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint
          git diff --exit-code -- backlog requirements docs/product/roadmap.md
      - name: Regenerate contracts
        run: |
          python scripts/generate_contracts.py
          git diff --exit-code -- schemas docs/api/openapi.json
      - name: Regenerate CLI documentation and client SDKs
        run: |
          uv run amesh --output quiet command-docs docs/cli/reference.md
          uv run python scripts/generate_sdks.py --check
          git diff --exit-code -- docs/cli/reference.md sdks/api
      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: 'origin/${{ github.base_ref }}:docs/api/openapi.json'
          revision: 'docs/api/openapi.json'
          fail-on: ERR
          review: false
      - name: Compile
        run: python -m compileall -q src tests scripts

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet

  harness-production-image:
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag amesh:harness-conformance .
      - name: Probe Pi through the production image
        run: >-
          docker run --rm --entrypoint python amesh:harness-conformance
          -m amesh.harness_probe

  kestra-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install uv
          uv pip install --system -e '.[dev]'
      - name: Verify pinned compatibility and migration contracts
        run: >-
          pytest -q
          tests/compatibility
          tests/expressions/test_pebble_contract.py
      - name: Validate the core fixture on the pinned Kestra black box
        shell: bash
        run: |
          set -euo pipefail
          container=amesh-kestra-conformance-1330
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$container" \
            -e KESTRA_SERVER_BASIC_AUTH_USERNAME=admin@kestra.io \
            -e KESTRA_SERVER_BASIC_AUTH_PASSWORD=Admin1234 \
            -v "$PWD:/workspace" \
            kestra/kestra@sha256:6442cd361bdaf317484c282ed45a7529c1d90ae433a17f02cb378fd24362d297 \
            server local >/dev/null
          ready=false
          for _ in $(seq 1 60); do
            if docker logs "$container" 2>&1 | grep -q 'Main server is running'; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          docker exec "$container" sh -c \
            "/app/kestra flow validate --server http://localhost:8080 --user 'admin@kestra.io:Admin1234' /workspace/conformance/kestra/1.3.30/kestra-core-flow.yaml"
      - name: Block an unsupported full-version claim
        run: >-
          python -c "from amesh.kestra_compatibility import compatibility_manifest;
          value=compatibility_manifest();
          assert value['target']['version']=='1.3.30';
          assert value['releaseClaimAllowed'] is False;
          assert value['unresolvedGaps']"

  terraform-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: providers/terraform/go.mod
          cache-dependency-path: providers/terraform/go.sum
      - name: Format and test provider
        working-directory: providers/terraform
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
      - name: Build static provider
        working-directory: providers/terraform
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o build/terraform-provider-amesh .
      - name: Verify generated provider documentation
        working-directory: providers/terraform
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 generate \
            --provider-dir . --provider-name amesh --tf-version 1.15.8
          git diff --exit-code -- docs templates
      - name: Verify Terraform 1.15 provider schema
        run: |
          schema="$(docker run --rm -v "$PWD:/workspace" \
            -w /workspace/providers/terraform/testdata/compatibility \
            -e TF_CLI_CONFIG_FILE=/workspace/providers/terraform/testdata/compatibility/terraform.rc \
            hashicorp/terraform:1.15.8 providers schema -json)"
          test "$(jq '.provider_schemas["registry.terraform.io/amesh/amesh"].resource_schemas | length' <<<"$schema")" = 14
          test "$(jq '.provider_schemas["registry.terraform.io/amesh/amesh"].data_source_schemas | length' <<<"$schema")" = 14
      - name: Verify OpenTofu 1.12 provider schema
        run: |
          schema="$(docker run --rm -v "$PWD:/workspace" \
            -w /workspace/providers/terraform/testdata/compatibility \
            -e TF_CLI_CONFIG_FILE=/workspace/providers/terraform/testdata/compatibility/terraform.rc \
            ghcr.io/opentofu/opentofu:1.12.1 providers schema -json)"
          test "$(jq '.provider_schemas["registry.terraform.io/amesh/amesh"].resource_schemas | length' <<<"$schema")" = 14
          test "$(jq '.provider_schemas["registry.terraform.io/amesh/amesh"].data_source_schemas | length' <<<"$schema")" = 14

  kubernetes-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install uv
          uv pip install --system -e '.[dev,runtime]'
      - name: Verify generated CRDs and operator contracts
        run: |
          python scripts/generate_operator_crds.py
          git diff --exit-code -- charts/amesh/crds/platform.amesh.io_resources.yaml
          pytest -q tests/operator tests/test_helm_operator.py
      - name: Validate opt-in Helm profile
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            alpine/helm:3.19.0 lint charts/amesh --set operator.enabled=true
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            alpine/helm:3.19.0 template amesh charts/amesh \
            --namespace amesh-system --set operator.enabled=true >/dev/null

  sdk-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: sdks/api/java/pom.xml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdks/api/go/go.mod
      - name: Verify deterministic generation
        run: |
          python -m pip install uv
          uv run python scripts/generate_sdks.py --check
      - name: Test Python client
        run: |
          uv pip install --system pytest -e sdks/api/python
          pytest -q tests/sdk/test_python_execution_client.py
      - name: Build and test TypeScript client
        working-directory: sdks/api/typescript
        run: |
          npm install
          npm run build
          node ../../../tests/sdk/typescript_execution_client.mjs
      - name: Build and test Java client
        working-directory: sdks/api/java
        run: |
          mvn -q -DskipTests package
          mvn -q dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          mkdir -p target/test-classes
          javac --add-modules jdk.httpserver \
            -cp "target/classes:$(cat target/classpath.txt)" \
            -d target/test-classes ../../../tests/sdk/java/AmeshExecutionClientTestMain.java
          java --add-modules jdk.httpserver \
            -cp "target/classes:target/test-classes:$(cat target/classpath.txt)" \
            AmeshExecutionClientTestMain
      - name: Test Go client
        working-directory: sdks/api/go
        run: |
          test -z "$(gofmt -l .)"
          go test ./...

  postgres-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: amesh
          POSTGRES_USER: amesh
          POSTGRES_PASSWORD: amesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amesh -d amesh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://amesh:amesh@localhost:5432/amesh
      AMESH_TEST_DATABASE_URL: postgresql+asyncpg://amesh:amesh@localhost:5432/amesh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install uv
          uv pip install --system -e '.[dev]'
      - name: Apply migrations
        run: uv run python -m amesh.migrations
      - name: Verify migration and PostgreSQL operations contracts
        run: >-
          uv run pytest
          tests/test_migrations.py
          tests/adapters/postgres/test_migration_contract.py
          tests/adapters/postgres/test_operations_repository.py
