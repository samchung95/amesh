name: release-artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  clean-room-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out AMESH implementation
        uses: actions/checkout@v4
        with:
          path: amesh
          persist-credentials: false
      - name: Check out pinned public reference in isolated reviewer context
        uses: actions/checkout@v4
        with:
          repository: kestra-io/kestra
          ref: db49f3b2c2af60d61df10adb6f9fc34e4776b65b
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run provenance and similarity gates
        run: |
          python amesh/scripts/check_clean_room.py --reference-tree reference
          python -m pip install uv
          cd amesh
          uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint

  build:
    needs: clean-room-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: harnesses/pi/package-lock.json
      - run: |
          python -m pip install uv
          uv sync --extra runtime --extra dev --locked
      - run: make validate
      - run: bash scripts/package_repo.sh
      - run: uv run python scripts/package_sdks.py --output-dir dist/sdk
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ../amesh.zip
            ../amesh.tar.gz
            dist/sdk/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ../amesh.zip
            ../amesh.tar.gz
            ../amesh.sha256
            dist/sdk/*.zip
            dist/sdk/amesh-clients.sha256
          generate_release_notes: true

  sdk-live-conformance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AMESH_SDK_LIVE_ENDPOINT: http://127.0.0.1:8000
      AMESH_SDK_LIVE_TOKEN: development-token
      AMESH_SDK_LIVE_TENANT: default
      AMESH_SDK_LIVE_NAMESPACE: examples.getting_started
      AMESH_SDK_LIVE_FLOW: hello_world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: sdks/api/java/pom.xml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdks/api/go/go.mod
      - name: Start live AMESH conformance environment
        run: |
          docker compose up -d --build postgres minio minio-init api executor
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/ready >/dev/null
          curl --fail --silent --request PUT \
            --header "Authorization: Bearer development-token" \
            --header "X-Amesh-Tenant: default" \
            --header "Content-Type: application/yaml" \
            --data-binary @examples/hello-world.yaml \
            http://127.0.0.1:8000/api/v1/flows >/dev/null
      - name: Run Python live conformance
        run: |
          python -m pip install uv
          uv pip install --system pytest -e sdks/api/python
          pytest -q tests/sdk/test_python_execution_client.py
      - name: Run TypeScript live conformance
        working-directory: sdks/api/typescript
        run: |
          npm install
          npm run build
          node ../../../tests/sdk/typescript_execution_client.mjs
      - name: Run Java live conformance
        working-directory: sdks/api/java
        run: |
          mvn -q -DskipTests package
          mvn -q dependency:build-classpath -Dmdep.outputFile=target/classpath.txt
          mkdir -p target/test-classes
          javac --add-modules jdk.httpserver \
            -cp "target/classes:$(cat target/classpath.txt)" \
            -d target/test-classes ../../../tests/sdk/java/AmeshExecutionClientTestMain.java
          java --add-modules jdk.httpserver \
            -cp "target/classes:target/test-classes:$(cat target/classpath.txt)" \
            AmeshExecutionClientTestMain
      - name: Run Go live conformance
        working-directory: sdks/api/go
        run: go test ./...
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color api executor
      - name: Stop conformance environment
        if: always()
        run: docker compose down --volumes --remove-orphans

  terraform-provider:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: providers/terraform/go.mod
          cache-dependency-path: providers/terraform/go.sum
      - name: Import provider GPG key
        id: import_provider_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Build, sign and publish provider archives
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: providers/terraform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_provider_gpg.outputs.fingerprint }}
