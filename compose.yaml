name: amesh

services:
  api:
    build:
      context: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://amesh:amesh@postgres:5432/amesh
      DATABASE_POOL_SIZE: "10"
      DATABASE_MAX_OVERFLOW: "10"
      DATABASE_POOL_TIMEOUT_SECONDS: "30"
      DATABASE_POOL_RECYCLE_SECONDS: "1800"
      DATABASE_PREPARED_STATEMENT_CACHE_SIZE: "100"
      DATABASE_TLS_MODE: disable
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: amesh
      OBJECT_STORAGE_ACCESS_KEY: minio
      OBJECT_STORAGE_SECRET_KEY: minio-development-only
      AUTH_MODE: development
      PRODUCT_TELEMETRY_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amesh
      POSTGRES_USER: amesh
      POSTGRES_PASSWORD: amesh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/0001_foundation.sql:/docker-entrypoint-initdb.d/0001_foundation.sql:ro
      - ./migrations/0002_mvp_task_retry.sql:/docker-entrypoint-initdb.d/0002_mvp_task_retry.sql:ro
      - ./migrations/0003_canonical_resource_metadata.sql:/docker-entrypoint-initdb.d/0003_canonical_resource_metadata.sql:ro
      - ./migrations/0004_authorization.sql:/docker-entrypoint-initdb.d/0004_authorization.sql:ro
      - ./migrations/0005_service_credentials.sql:/docker-entrypoint-initdb.d/0005_service_credentials.sql:ro
      - ./migrations/0006_multi_tenancy.sql:/docker-entrypoint-initdb.d/0006_multi_tenancy.sql:ro
      - ./migrations/0007_tenant_queue_notifications.sql:/docker-entrypoint-initdb.d/0007_tenant_queue_notifications.sql:ro
      - ./migrations/0008_restricted_tenant_resolution.sql:/docker-entrypoint-initdb.d/0008_restricted_tenant_resolution.sql:ro
      - ./migrations/0009_tenant_administration_role.sql:/docker-entrypoint-initdb.d/0009_tenant_administration_role.sql:ro
      - ./migrations/0010_execution_trigger_context.sql:/docker-entrypoint-initdb.d/0010_execution_trigger_context.sql:ro
      - ./migrations/0011_execution_event_model.sql:/docker-entrypoint-initdb.d/0011_execution_event_model.sql:ro
      - ./migrations/0012_metadata_repository.sql:/docker-entrypoint-initdb.d/0012_metadata_repository.sql:ro
      - ./migrations/0013_transport_dead_letters.sql:/docker-entrypoint-initdb.d/0013_transport_dead_letters.sql:ro
      - ./migrations/0014_executor_dispatch.sql:/docker-entrypoint-initdb.d/0014_executor_dispatch.sql:ro
      - ./migrations/0015_scheduler_state.sql:/docker-entrypoint-initdb.d/0015_scheduler_state.sql:ro
      - ./migrations/0016_worker_protocol.sql:/docker-entrypoint-initdb.d/0016_worker_protocol.sql:ro
      - ./migrations/0017_execution_interventions.sql:/docker-entrypoint-initdb.d/0017_execution_interventions.sql:ro
      - ./migrations/0018_subflow_relationships.sql:/docker-entrypoint-initdb.d/0018_subflow_relationships.sql:ro
      - ./migrations/0019_admission_control.sql:/docker-entrypoint-initdb.d/0019_admission_control.sql:ro
      - ./migrations/0020_backfills.sql:/docker-entrypoint-initdb.d/0020_backfills.sql:ro
      - ./migrations/0021_runnable_task_contract.sql:/docker-entrypoint-initdb.d/0021_runnable_task_contract.sql:ro
      - ./migrations/0022_postgresql_operations.sql:/docker-entrypoint-initdb.d/0022_postgresql_operations.sql:ro
      - ./migrations/0023_distributed_queue_profile.sql:/docker-entrypoint-initdb.d/0023_distributed_queue_profile.sql:ro
      - ./migrations/0024_reconciliation_runs.sql:/docker-entrypoint-initdb.d/0024_reconciliation_runs.sql:ro
      - ./migrations/0025_service_registry.sql:/docker-entrypoint-initdb.d/0025_service_registry.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amesh -d amesh"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest # Development only; pin a tested digest for production
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
