name: Architecture or product decision
description: Propose a decision or resolve an item in DECISIONS_NEEDED.md
title: "[Decision]: "
labels: ["type:architecture"]
body:
  - type: input
    id: decision
    attributes:
      label: Decision ID
      placeholder: Q-006 or ADR-001
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and constraints
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommended option and consequences
    validations:
      required: true
  - type: textarea
    id: traceability
    attributes:
      label: Affected requirements, epics and contracts
