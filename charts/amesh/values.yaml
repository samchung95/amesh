image:
  repository: amesh
  tag: mvp
  pullPolicy: IfNotPresent

appEnv: production

auth:
  mode: credentials
  policy: local
  sessionIdleSeconds: 1800
  sessionAbsoluteSeconds: 43200
  sessionRotationSeconds: 900
  sessionOverlapSeconds: 30
  loginRateLimitPerMinute: 30
  loginMaxFailures: 5
  loginLockSeconds: 900

identity:
  providerConfigExistingSecret: ""
  providerConfigKey: identity-providers
  scimConfigKey: scim-providers
  credentialSecret: ""
  mountPath: /var/run/secrets/amesh/identity

server:
  replicas: 2
  resources: {}

worker:
  enabled: false
  replicas: 1
  pollSeconds: 5
  recoveryGraceSeconds: 120
  reconciliationIntervalSeconds: 60
  reconciliationMaxRepairs: 10
  reconciliationStuckAfterSeconds: 300
  group: default
  resources: {}

serviceRoles:
  executor:
    enabled: true
    replicas: 2
    resources: {}
  scheduler:
    enabled: true
    replicas: 2
    resources: {}
  worker:
    enabled: true
    replicas: 2
    resources: {}
  indexer:
    enabled: true
    replicas: 2
    resources: {}
  maintenance:
    enabled: true
    replicas: 1
    resources: {}

highAvailability:
  topologyKey: topology.kubernetes.io/zone
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
  terminationGracePeriodSeconds: 30
  minReadySeconds: 5
  maxUnavailable: 0
  maxSurge: 1
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

tenancy:
  mode: single
  singleTenantSlug: default

service:
  type: ClusterIP
  port: 8000
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"

network:
  topology: split
  privateEndpoint: false
  privateEndpointAnnotations: {}
  externalBaseURL: ""
  trustedProxyRanges: []
  tls:
    mode: disabled
    existingSecret: ""
    mountPath: /var/run/secrets/amesh/network
    certificateKey: tls.crt
    privateKeyKey: tls.key
    clientCAKey: client-ca.crt
    clientAuth: none
    minimumVersion: TLSv1.2
    ciphers: ECDHE+AESGCM:ECDHE+CHACHA20
  proxy:
    existingSecret: ""
    httpKey: http-proxy-url
    httpsKey: https-proxy-url
    httpURL: ""
    httpsURL: ""
    noProxy: []
  outboundTLS:
    caKey: outbound-ca.crt
    clientCertificateKey: outbound-client.crt
    clientKeyKey: outbound-client.key
    useCA: false
    useClientCertificate: false
  egress:
    allowedHosts:
      - "*"
    allowedPrivateHosts: []
    diagnosticHosts: []
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  policy:
    enabled: false
    ingressNamespaceSelector: {}
    egressCidrs: []

serviceAccount:
  create: true
  name: ""

database:
  existingSecret: amesh-database
  key: database-url
  readReplicaExistingSecret: ""
  readReplicaKey: database-read-replica-url
  migrationExistingSecret: ""
  migrationKey: database-url
  poolSize: 10
  maxOverflow: 10
  poolTimeoutSeconds: 30
  poolRecycleSeconds: 1800
  preparedStatementCacheSize: 100
  tlsMode: verify-full
  tlsCAFile: ""

objectStorage:
  backend: s3
  endpoint: ""
  region: us-east-1
  bucket: amesh
  workloadIdentity: true
  encryptionKeyId: ""
  proxyURL: ""
  caFile: ""
  azureAccountURL: ""
  googleProject: ""
  googleEndpoint: ""
  googleCredentialsFile: ""
  consistencyAttempts: 5
  consistencyDelaySeconds: 0.1
  spoolMemoryBytes: 8388608
  existingSecret: ""
  accessKeyKey: access-key
  secretKeyKey: secret-key
  azureAccountKeyKey: azure-account-key

encryption:
  keyId: ""
  existingSecret: ""
  key: model-continuation-key

recovery:
  enabled: false
  schedule: "0 3 * * *"
  profile: v1
  actor: system:scheduled-recovery
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 0
  resources: {}

adminToken:
  existingSecret: amesh-admin
  key: token

tokenPepper:
  existingSecret: amesh-admin
  key: token-pepper
  previousKey: ""

webhookSigningKey:
  existingSecret: ""
  key: webhook-signing-key

pluginRegistrySigningKey:
  existingSecret: ""
  key: registry-signing-key

openRouter:
  existingSecret: ""
  key: api-key
  model: openai/gpt-5.6-luna

operator:
  enabled: false
  replicas: 1
  clusterWideRBAC: false
  watchNamespaces: []
  labelSelector: ""
  targets: []
  endpoint: ""
  credentialExistingSecret: ""
  credentialKey: token
  resyncSeconds: 60
  watchTimeoutSeconds: 30
  retryInitialSeconds: 2
  retryMaxSeconds: 120
  metricsPort: 9090
  resources: {}

taskNamespace: ""
taskRunner:
  profiles: []
logLevel: INFO
observability:
  otlpEndpoint: ""
  otlpHeadersExistingSecret: ""
  otlpHeadersKey: otlp-headers
  otlpBatchQueueSize: 2048
  otlpBatchSize: 512
  otlpExportTimeoutSeconds: 5
  logDestination: stdout
  logFilePath: ""
  logSyslogAddress: 127.0.0.1:514
  logQueueCapacity: 10000
  referenceAssets:
    enabled: true
serviceHeartbeatSeconds: 5
serviceStaleAfterSeconds: 20
serviceCycleSeconds: 5

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
