<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMESH UI/UX visual audit contact sheet</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; background: #f2f0e7; color: #14211d; }
    body { max-width: 1800px; margin: 0 auto; padding: 32px; }
    h1, h2 { font-family: ui-monospace, monospace; }
    p { color: #52615b; }
    section { margin: 36px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; align-items: start; }
    figure { margin: 0; padding: 10px; background: #fffef9; border: 1px solid #bdc4be; border-radius: 8px; }
    img { display: block; width: 100%; max-height: 560px; object-fit: contain; object-position: top; background: #f7f5ed; }
    figcaption { padding: 9px 2px 2px; overflow-wrap: anywhere; font: 600 12px ui-monospace, monospace; }
    a { color: #007a61; }
  </style>
</head>
<body>
  <h1>AMESH UI/UX visual audit</h1>
  <p>One-page contact sheet for every deterministic before/after capture and the authenticated live Compose evidence. Select an image to open it at full resolution.</p>
  <main id="audit"></main>
  <script>
    const surfaces = ['mission-control', 'executions', 'execution-trace', 'flows', 'workflow-starters', 'workflow-editor']
    const viewports = ['desktop', 'tablet', 'mobile']
    const states = ['empty-executions', 'failed-flows', 'loading-flows', 'permission-denied-administration', 'workflow-validation']
    const sets = ['before', 'after'].map((phase) => ({
      title: `${phase[0].toUpperCase()}${phase.slice(1)} — populated and non-happy states`,
      paths: [
        `screenshots/${phase}/desktop-login.png`,
        ...viewports.flatMap((viewport) => surfaces.map((surface) => `screenshots/${phase}/${viewport}-${surface}.png`)),
        ...states.map((state) => `screenshots/${phase}/states/${state}.png`),
      ],
    }))
    sets.push({ title: 'Live Compose — authenticated deployment', paths: ['screenshots/live/compose-control-room.png', 'screenshots/live/compose-execution-trace.png'] })
    const root = document.querySelector('#audit')
    for (const set of sets) {
      const section = document.createElement('section')
      const heading = document.createElement('h2')
      heading.textContent = set.title
      const grid = document.createElement('div')
      grid.className = 'grid'
      for (const path of set.paths) {
        const figure = document.createElement('figure')
        const link = document.createElement('a')
        link.href = path
        const image = document.createElement('img')
        image.src = path
        image.alt = path.split('/').at(-1).replace('.png', '').replaceAll('-', ' ')
        image.loading = 'lazy'
        const caption = document.createElement('figcaption')
        caption.textContent = path
        link.append(image)
        figure.append(link, caption)
        grid.append(figure)
      }
      section.append(heading, grid)
      root.append(section)
    }
  </script>
</body>
</html>
