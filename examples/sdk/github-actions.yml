name: run-amesh-flow

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK archive
        run: python -m pip install dist/sdk/amesh-client-python-0.2.0.zip
      - name: Launch and wait
        env:
          AMESH_ENDPOINT: ${{ secrets.AMESH_ENDPOINT }}
          AMESH_TOKEN: ${{ secrets.AMESH_TOKEN }}
        run: python examples/sdk/cli.py examples.getting_started hello_world --name CI
