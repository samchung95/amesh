name: amesh-local-verification

x-verification-image: &verification-image amesh-local-verification:local

x-verification-build: &verification-build
  context: ..
  dockerfile: docker/Dockerfile.verify

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amesh
      POSTGRES_USER: amesh
      POSTGRES_PASSWORD: amesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amesh -d amesh"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: *verification-image
    build: *verification-build
    entrypoint: ["uv", "run", "--extra", "runtime", "python", "-m", "amesh.entrypoints.migrations"]
    environment:
      DATABASE_URL: postgresql+asyncpg://amesh:amesh@postgres:5432/amesh
    depends_on:
      postgres:
        condition: service_healthy

  verify:
    image: *verification-image
    build: *verification-build
    environment:
      AMESH_ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://amesh:amesh@postgres:5432/amesh
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["all"]

  package:
    image: *verification-image
    build: *verification-build
    environment:
      AMESH_ARTIFACT_DIR: /artifacts
    volumes:
      - ../dist/local-release:/artifacts
    command: ["package"]

  live-openrouter:
    image: *verification-image
    build: *verification-build
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_TEST_MODELS: ${OPENROUTER_TEST_MODELS:-openai/gpt-5.6-luna,deepseek/deepseek-v4-flash-vision-exp}
      OPENROUTER_QUALIFICATION_MODELS: ${OPENROUTER_QUALIFICATION_MODELS:-openai/gpt-5.6-luna,deepseek/deepseek-v4-flash-vision-exp}
    volumes:
      - ../.artifacts:/workspace/.artifacts
    command: ["live-openrouter"]
