name: amesh-hardened

# Client-facing traffic is published only on loopback. All service-to-service
# traffic stays on the internal network below.
x-common-environment: &common-environment
  APP_ENV: production
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  DATABASE_URL: ${AMESH_DATABASE_URL:?Set AMESH_DATABASE_URL to a password-free PostgreSQL URL}
  DATABASE_TLS_MODE: ${AMESH_DATABASE_TLS_MODE:?Set AMESH_DATABASE_TLS_MODE to disable, require, or verify-full}
  PGPASSFILE: /run/secrets/postgres-pgpass
  OBJECT_STORAGE_BACKEND: local
  OBJECT_STORAGE_LOCAL_ROOT: /var/lib/amesh/storage
  AMESH_SECRETS_DIR: /run/secrets
  AMESH_ADMIN_TOKEN: secret://admin-token
  AMESH_TOKEN_PEPPER: secret://token-pepper
  MODEL_CONTINUATION_KEY_ID: hardened-primary
  MODEL_CONTINUATION_ENCRYPTION_KEY: secret://model-continuation-key
  WEBHOOK_SIGNING_KEY: secret://webhook-signing-key
  PLUGIN_REGISTRY_SIGNING_KEY: secret://registry-signing-key
  PLUGIN_TRUST_MODE: signed-only
  AUTH_MODE: credentials
  AUTH_POLICY: local
  EXECUTION_RUNNER_MODE: local
  LOCAL_PROCESS_RUNNER_ENABLED: "true"
  NETWORK_PUBLIC_EXPOSURE: "false"
  NETWORK_PRIVATE_ENDPOINT: "true"
  NETWORK_TOPOLOGY: split
  NETWORK_EGRESS_ALLOWED_HOSTS: '["localhost"]'
  CORE_HTTP_ALLOWED_PRIVATE_HOSTS: "[]"
  SERVICE_ENABLED_ROLES: '["webserver","executor","scheduler"]'
  PRODUCT_TELEMETRY_ENABLED: "false"
  PRODUCT_UPDATE_CHECKS_ENABLED: "false"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AMESH_POSTGRES_DB:?Set AMESH_POSTGRES_DB}
      POSTGRES_USER: ${AMESH_POSTGRES_USER:?Set AMESH_POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    networks:
      - private
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
    entrypoint: ["/app/scripts/hardened-entrypoint.sh"]
    command: ["python", "-m", "amesh.migrations"]
    environment:
      <<: *common-environment
      SERVICE_ROLE: webserver
      SERVICE_INSTANCE_NAME: hardened-migrate
    secrets: &application-secrets
      - admin-token
      - token-pepper
      - model-continuation-key
      - webhook-signing-key
      - registry-signing-key
      - source: postgres-pgpass
        target: postgres-pgpass
        uid: "100"
        gid: "101"
        mode: 0400
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  preflight:
    build:
      context: .
    entrypoint: ["/app/scripts/hardened-entrypoint.sh"]
    command: ["python", "-m", "amesh.deployment_profile", "--check-settings"]
    environment:
      <<: *common-environment
      SERVICE_ROLE: webserver
      SERVICE_INSTANCE_NAME: hardened-preflight
    secrets: *application-secrets
    networks:
      - private
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  storage-init:
    build:
      context: .
    command: ["sh", "-c", "mkdir -p /var/lib/amesh/storage && chown -R 100:101 /var/lib/amesh/storage"]
    networks:
      - private
    volumes:
      - application-storage:/var/lib/amesh/storage
    depends_on:
      preflight:
        condition: service_completed_successfully
    user: "0:0"
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
    entrypoint: ["/app/scripts/hardened-entrypoint.sh"]
    command: ["python", "-m", "amesh.server"]
    environment:
      <<: *common-environment
      SERVICE_ROLE: webserver
      SERVICE_INSTANCE_NAME: hardened-webserver
    secrets: *application-secrets
    networks:
      - private
      - loopback
    ports:
      - "127.0.0.1:${AMESH_HARDENED_PORT:-8000}:8000"
    volumes:
      - application-storage:/var/lib/amesh/storage
    depends_on:
      preflight:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  executor:
    build:
      context: .
    entrypoint: ["/app/scripts/hardened-entrypoint.sh"]
    command: ["python", "-m", "amesh.role"]
    environment:
      <<: *common-environment
      SERVICE_ROLE: executor
      SERVICE_INSTANCE_NAME: hardened-executor
    secrets: *application-secrets
    networks:
      - private
    volumes:
      - application-storage:/var/lib/amesh/storage
    depends_on:
      preflight:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-m", "amesh.role", "--check", "readiness"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  scheduler:
    build:
      context: .
    entrypoint: ["/app/scripts/hardened-entrypoint.sh"]
    command: ["python", "-m", "amesh.role"]
    environment:
      <<: *common-environment
      SERVICE_ROLE: scheduler
      SERVICE_INSTANCE_NAME: hardened-scheduler
    secrets: *application-secrets
    networks:
      - private
    volumes:
      - application-storage:/var/lib/amesh/storage
    depends_on:
      preflight:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-m", "amesh.role", "--check", "readiness"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

networks:
  private:
    internal: true
  loopback: {}

secrets:
  admin-token:
    file: ${AMESH_HARDENED_SECRETS_DIR:?Set AMESH_HARDENED_SECRETS_DIR}/admin-token
  token-pepper:
    file: ${AMESH_HARDENED_SECRETS_DIR:?Set AMESH_HARDENED_SECRETS_DIR}/token-pepper
  model-continuation-key:
    file: ${AMESH_HARDENED_SECRETS_DIR:?Set AMESH_HARDENED_SECRETS_DIR}/model-continuation-key
  webhook-signing-key:
    file: ${AMESH_HARDENED_SECRETS_DIR:?Set AMESH_HARDENED_SECRETS_DIR}/webhook-signing-key
  registry-signing-key:
    file: ${AMESH_HARDENED_SECRETS_DIR:?Set AMESH_HARDENED_SECRETS_DIR}/registry-signing-key
  postgres-password:
    file: ${AMESH_HARDENED_SECRETS_DIR:?Set AMESH_HARDENED_SECRETS_DIR}/postgres-password
  postgres-pgpass:
    file: ${AMESH_HARDENED_SECRETS_DIR:?Set AMESH_HARDENED_SECRETS_DIR}/postgres-pgpass

volumes:
  postgres-data:
  application-storage:
