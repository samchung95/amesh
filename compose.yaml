name: amesh

x-observability-environment: &observability-environment
  LOG_DESTINATION: ${LOG_DESTINATION:-stdout}
  LOG_FILE_PATH: ${LOG_FILE_PATH:-}
  LOG_SYSLOG_ADDRESS: ${LOG_SYSLOG_ADDRESS:-127.0.0.1:514}
  LOG_QUEUE_CAPACITY: ${LOG_QUEUE_CAPACITY:-10000}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-{}}
  OTEL_BATCH_QUEUE_SIZE: ${OTEL_BATCH_QUEUE_SIZE:-2048}
  OTEL_BATCH_SIZE: ${OTEL_BATCH_SIZE:-512}
  OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-5}
  MODEL_CONTINUATION_KEY_ID: compose-development
  MODEL_CONTINUATION_ENCRYPTION_KEY: ${MODEL_CONTINUATION_ENCRYPTION_KEY:-56sxfzMhHF5kTfJeU8mk5ZuckryTJWyUrlByWTmyQbo=}
  SERVICE_ENABLED_ROLES: '["webserver","executor","scheduler","worker","indexer","maintenance"]'

services:
  api:
    build:
      context: .
    environment:
      <<: *observability-environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://amesh:amesh@postgres:5432/amesh
      DATABASE_POOL_SIZE: "10"
      DATABASE_MAX_OVERFLOW: "10"
      DATABASE_POOL_TIMEOUT_SECONDS: "30"
      DATABASE_POOL_RECYCLE_SECONDS: "1800"
      DATABASE_PREPARED_STATEMENT_CACHE_SIZE: "100"
      DATABASE_TLS_MODE: disable
      OBJECT_STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: amesh
      OBJECT_STORAGE_ACCESS_KEY: minio
      OBJECT_STORAGE_SECRET_KEY: minio-development-only
      OBJECT_STORAGE_WORKLOAD_IDENTITY: "false"
      AUTH_MODE: development
      AUTH_POLICY: local
      CORE_HTTP_ALLOWED_PRIVATE_HOSTS: '["host.docker.internal"]'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AMESH_EXTERNAL_MCP_TOKEN: ${AMESH_EXTERNAL_MCP_TOKEN:-}
      SERVICE_ROLE: webserver
      SERVICE_INSTANCE_NAME: compose-webserver
      READINESS_CHECK_STORAGE: "true"
      PLUGIN_INSTALL_ROOT: /var/lib/amesh/plugins
      PLUGIN_REGISTRY_ROOT: /var/lib/amesh/plugins/registry
      PLUGIN_REGISTRY_SIGNING_KEY_ID: compose-local
      PLUGIN_REGISTRY_SIGNING_KEY: amesh-compose-registry-signing-key-change-me
      DOCKER_RUNNER_ENABLED: "true"
      DOCKER_IMAGE_POLICY: '{"allowedRegistries":["docker.io"],"allowTags":true}'
      PRODUCT_TELEMETRY_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    read_only: true
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - plugin-data:/var/lib/amesh/plugins
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  executor:
    build:
      context: .
    command: ["python", "-m", "amesh.role"]
    environment:
      <<: *observability-environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://amesh:amesh@postgres:5432/amesh
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_TLS_MODE: disable
      OBJECT_STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: amesh
      OBJECT_STORAGE_ACCESS_KEY: minio
      OBJECT_STORAGE_SECRET_KEY: minio-development-only
      OBJECT_STORAGE_WORKLOAD_IDENTITY: "false"
      AUTH_MODE: development
      CORE_HTTP_ALLOWED_PRIVATE_HOSTS: '["host.docker.internal"]'
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AMESH_EXTERNAL_MCP_TOKEN: ${AMESH_EXTERNAL_MCP_TOKEN:-}
      PRODUCT_TELEMETRY_ENABLED: "false"
      PLUGIN_INSTALL_ROOT: /var/lib/amesh/plugins
      SERVICE_ROLE: executor
      SERVICE_INSTANCE_NAME: compose-executor
      SERVICE_CYCLE_SECONDS: "1"
      EXECUTION_RUNNER_MODE: local
      DOCKER_RUNNER_ENABLED: "true"
      DOCKER_IMAGE_POLICY: '{"allowedRegistries":["docker.io"],"allowTags":true}'
      WORKER_RECOVERY_GRACE_SECONDS: "180"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "amesh.role", "--check", "readiness"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - plugin-data:/var/lib/amesh/plugins
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  scheduler:
    build:
      context: .
    command: ["python", "-m", "amesh.role"]
    environment:
      <<: *observability-environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://amesh:amesh@postgres:5432/amesh
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_TLS_MODE: disable
      AUTH_MODE: development
      PRODUCT_TELEMETRY_ENABLED: "false"
      SERVICE_ROLE: scheduler
      SERVICE_INSTANCE_NAME: compose-scheduler
      SERVICE_CYCLE_SECONDS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "amesh.role", "--check", "readiness"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  indexer:
    build:
      context: .
    command: ["python", "-m", "amesh.role"]
    environment:
      <<: *observability-environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://amesh:amesh@postgres:5432/amesh
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_TLS_MODE: disable
      AUTH_MODE: development
      SERVICE_ROLE: indexer
      SERVICE_INSTANCE_NAME: compose-indexer
      SERVICE_CYCLE_SECONDS: "1"
      WEBHOOK_SIGNING_KEY: amesh-webhook-development-signing-key
      CORE_HTTP_ALLOWED_PRIVATE_HOSTS: '["host.docker.internal"]'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "amesh.role", "--check", "readiness"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
    command: ["python", "-m", "amesh.role"]
    environment:
      <<: *observability-environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://amesh:amesh@postgres:5432/amesh
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_TLS_MODE: disable
      AUTH_MODE: development
      PRODUCT_TELEMETRY_ENABLED: "false"
      SERVICE_ROLE: worker
      SERVICE_INSTANCE_NAME: compose-worker
      SERVICE_CYCLE_SECONDS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "amesh.role", "--check", "readiness"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  maintenance:
    build:
      context: .
    command: ["python", "-m", "amesh.role"]
    environment:
      <<: *observability-environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://amesh:amesh@postgres:5432/amesh
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      DATABASE_TLS_MODE: disable
      AUTH_MODE: development
      PRODUCT_TELEMETRY_ENABLED: "false"
      SERVICE_ROLE: maintenance
      SERVICE_INSTANCE_NAME: compose-maintenance
      SERVICE_CYCLE_SECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "amesh.role", "--check", "readiness"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
    command: ["python", "-m", "amesh.migrations"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://amesh:amesh@postgres:5432/amesh
      DATABASE_TLS_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: amesh
      POSTGRES_USER: amesh
      POSTGRES_PASSWORD: amesh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amesh -d amesh"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest # Development only; pin a tested digest for production
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 minio minio-development-only;
        do sleep 1; done;
        mc mb --ignore-existing local/amesh;
        mc version enable local/amesh

volumes:
  postgres-data:
  minio-data:
  plugin-data:
