name: release-artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  clean-room-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out AMESH implementation
        uses: actions/checkout@v4
        with:
          path: amesh
          persist-credentials: false
      - name: Check out pinned public reference in isolated reviewer context
        uses: actions/checkout@v4
        with:
          repository: kestra-io/kestra
          ref: db49f3b2c2af60d61df10adb6f9fc34e4776b65b
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run provenance and similarity gates
        run: |
          python amesh/scripts/check_clean_room.py --reference-tree reference
          python -m pip install uv
          cd amesh
          uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint

  build:
    needs: clean-room-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install uv
          uv sync --extra runtime --extra dev --locked
      - run: make validate
      - run: bash scripts/package_repo.sh
      - run: uv run python scripts/package_sdks.py --output-dir dist/sdk
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ../amesh.zip
            ../amesh.tar.gz
            dist/sdk/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ../amesh.zip
            ../amesh.tar.gz
            ../amesh.sha256
            dist/sdk/*.zip
            dist/sdk/amesh-clients.sha256
          generate_release_notes: true

  terraform-provider:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: providers/terraform/go.mod
          cache-dependency-path: providers/terraform/go.sum
      - name: Import provider GPG key
        id: import_provider_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Build, sign and publish provider archives
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: providers/terraform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_provider_gpg.outputs.fingerprint }}
